# RULER Needle-in-a-Haystack (NIAH) — default 4K context.
# Synthetic retrieval task: a secret key is buried in noise text,
# and the model must recall it exactly.
#
# Generate data first:  python3 gen_ruler_niah.py
# Run:  ./run.sh ... --task ruler_niah --gen-max-tokens 4096 --eval-only --num-fewshot 0 --limit 100
task: ruler_niah
dataset_path: json
dataset_kwargs:
  data_files:
    test: data/ruler_niah/niah_4k.jsonl
output_type: generate_until
test_split: test
doc_to_text: "{{context}}\n\n{{query}} /no_think"
doc_to_target: "{{answer}}"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
    regexes_to_ignore:
      - "\\."
      - "\\s+"
generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 256
repeats: 1
num_fewshot: 0
filter_list:
  - name: "extract-answer"
    filter:
      - function: "regex"
        group_select: -1
        regex_pattern: "(\\d{4,})"
      - function: "take_first"
metadata:
  version: 1.1
